services:
  medieval2:
    build: .
    image: medieval2-ubuntu:24.04
    container_name: medieval2-ubuntu
    hostname: medieval2-ubuntu
    restart: unless-stopped
    init: true
    shm_size: "2gb"
    environment:
      - SDL_AUDIODRIVER=dummy
      - WORKER_ID=1
    volumes:
      # Hardlinked copy of the Windows game install + M2TWEOP (see setup_game.sh)
      - ./game:/home/tomek/game
      - ./wineprefix:/home/tomek/.wine
      # Shared IPC volume with the trainer
      - ./workspace:/home/tomek/workspace
    ulimits:
      nofile: {soft: 524288, hard: 524288}
    tty: true
    stdin_open: true

  # Optional Parallel Worker 2 (Spin up via: docker compose --profile workers up -d)
  medieval2-worker2:
    image: medieval2-ubuntu:24.04
    container_name: medieval2-worker2
    hostname: medieval2-worker2
    restart: "no"
    init: true
    shm_size: "2gb"
    environment:
      - SDL_AUDIODRIVER=dummy
      - WORKER_ID=2
    volumes:
      - ./game-2:/home/tomek/game
      - ./wineprefix-2:/home/tomek/.wine
      - ./workspace:/home/tomek/workspace
    ulimits:
      nofile: {soft: 524288, hard: 524288}
    tty: true
    stdin_open: true
    profiles:
      - workers
      - all

  # Optional Parallel Worker 3 (Spin up via: docker compose --profile workers up -d)
  medieval2-worker3:
    image: medieval2-ubuntu:24.04
    container_name: medieval2-worker3
    hostname: medieval2-worker3
    restart: "no"
    init: true
    shm_size: "2gb"
    environment:
      - SDL_AUDIODRIVER=dummy
      - WORKER_ID=3
    volumes:
      - ./game-3:/home/tomek/game
      - ./wineprefix-3:/home/tomek/.wine
      - ./workspace:/home/tomek/workspace
    ulimits:
      nofile: {soft: 524288, hard: 524288}
    tty: true
    stdin_open: true
    profiles:
      - workers
      - all

  llm:
    build: ./llm
    image: medieval2-llm:latest
    container_name: medieval2-llm
    hostname: llm
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}

  trainer:
    build: ./trainer
    image: medieval2-trainer:latest
    container_name: medieval2-trainer
    restart: unless-stopped
    depends_on:
      - llm
    environment:
      - LLM_URL=http://llm:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./workspace:/workspace
